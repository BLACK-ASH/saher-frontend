services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    depends_on:
      - backend

  backend:
    image: saher-backend:latest
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
    volumes:
      - ../saher-backend:/app
      - /app/node_modules
    command: pnpm start:dev
